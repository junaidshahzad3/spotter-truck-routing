# Render Blueprint: one Docker web service (API + built frontend).
# Deploy: Render dashboard -> New -> Blueprint -> pick this repo.
services:
  - type: web
    name: spotter-truck-routing
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CACHE_TIMEOUT_SECONDS
        value: "1800"
      - key: PLAN_RATE_LIMIT
        value: "30/min"
